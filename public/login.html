<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#075E54" />
  <title>Entrar - Ofertas</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <form id="login-form" class="gate-card" autocomplete="on">
    <div class="gate-logo">O</div>
    <h1>Ofertas</h1>
    <p>Entre com seu login de assinante para ver e copiar as ofertas.</p>
    <label>E-mail
      <input id="email" type="email" name="email" placeholder="seu@email.com" required autocomplete="username" />
    </label>
    <label>Senha
      <input id="password" type="password" name="password" placeholder="Sua senha" required autocomplete="current-password" />
    </label>
    <button type="submit">Entrar</button>
    <small id="login-error" class="gate-error" hidden>E-mail ou senha invalidos.</small>
  </form>
  <script src="/js/login.js" type="module"></script>
</body>
</html>
